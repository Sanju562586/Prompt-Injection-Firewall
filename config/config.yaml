# LLM Firewall Configuration
version: "1.0.0"

gateway:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "*"
  rate_limit:
    enabled: true
    requests_per_minute: 120
  upstream_llm:
    url: "https://api.openai.com/v1"
    timeout_seconds: 30.0
    api_key_env_var: "OPENAI_API_KEY"

scanners:
  input:
    enabled: true
    thresholds:
      block: 0.80
      warn: 0.55
    short_circuit: true
    max_input_length: 32000

  output:
    enabled: true
    check_exfiltration: true
    check_pii: true
    redact_pii_in_warn: false
    thresholds:
      block: 0.80
      warn: 0.55

  rag:
    enabled: true
    block_poisoned_chunks: true
    max_chunk_size: 4000

  pii:
    enabled: true
    # Entities considered sensitive enough to flag / block
    sensitive_entities:
      - "EMAIL_ADDRESS"
      - "PHONE_NUMBER"
      - "US_SSN"
      - "CREDIT_CARD"
      - "CRYPTO"
      - "IBAN_CODE"
      - "IP_ADDRESS"
      - "API_KEY"
    # General named entity locations (e.g. Paris, France) will not block by default
    ignore_general_locations: true
    anonymize_mode: "mask" # "mask" or "replace"

detection:
  rules:
    enabled: true
    block_score: 0.95

  semantic:
    enabled: true
    model_name: "all-MiniLM-L6-v2"
    thresholds:
      block: 0.78
      warn: 0.60

  classifier:
    enabled: true
    model_name: "protectai/deberta-v3-base-prompt-injection-v2"
    block_score: 0.80
    max_length: 512

  risk_engine:
    weights:
      rules: 0.45
      semantic: 0.35
      classifier: 0.40
    thresholds:
      critical: 0.85
      high: 0.75
      medium: 0.50
      low: 0.25

audit:
  database_path: "data/audit.db"
  max_snippet_length: 120
  query_page_size: 50

dashboard:
  port: 8501
  theme: "dark"
