[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "llm-firewall"
version     = "0.1.0"
description = "Production-grade prompt injection firewall with dual-stage scanning and RAG poisoning defense"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"
keywords    = ["llm", "security", "prompt-injection", "ai-safety", "firewall"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "sentence-transformers>=2.7.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7.0",
    "streamlit>=1.33.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "httpx>=0.27.0", "ruff>=0.4.0"]

[project.scripts]
llm-firewall-api       = "api.main:app"
llm-firewall-redteam   = "redteam.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["firewall*", "api*", "redteam*", "dashboard*"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"

[tool.ruff]
line-length = 100
select      = ["E", "F", "I"]
