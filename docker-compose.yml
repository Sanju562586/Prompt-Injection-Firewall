version: "3.9"

services:
  gateway:
    build: .
    container_name: llm-firewall-gateway
    command: uvicorn gateway.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - .:/app
    environment:
      - FIREWALL_DB_PATH=/app/data/audit.db
      - FIREWALL_CONFIG_PATH=/app/config/config.yaml

  dashboard:
    build: .
    container_name: llm-firewall-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - .:/app
    environment:
      - FIREWALL_DB_PATH=/app/data/audit.db
    depends_on:
      - gateway

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm-firewall-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - gateway
